[build-system]
requires = ["setuptools>=72", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-joint"
version = "0.1.0"
description = "CUE final joint-moment estimator and frozen-state CPU reproducibility candidate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.1.3", "scikit-learn==1.6.1", "scipy==1.15.3", "joblib==1.4.2", "threadpoolctl==3.5.0"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
cue-joint = "cue_joint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["frozen_cf_runtime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
